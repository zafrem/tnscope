[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tnscope"
version = "0.1.0"
description = "Trust and safety text scanner (hate, defamation)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "PyYAML", "pyahocorasick", "google-re2"]

[project.optional-dependencies]
dev = ["pytest", "jsonschema"]

[project.scripts]
tnscope = "tnscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tnscope"]
include = ["src/tnscope/_data/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
