  - {id: ja_target_person, type: target_person, terms: [お前は, あんたは, お前の家族, お前みたいな, 死ね], adjust: 15}
  - {id: ja_imperative, type: imperative, terms: [今すぐ, 直ちに, すぐ連絡, 急いで送金, すぐに振込], adjust: 10}
