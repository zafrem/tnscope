lang: en
rules:
  - id: en_nfkc
    type: nfkc
  - id: en_strip_invisible
    type: strip
    chars: ["\u200B", "\u200C", "\u200D", "\uFEFF", "\u2060", "\u00AD"]
  - id: en_homoglyphs
    type: map
    mapping: {"\u0430": "a", "\u0435": "e", "\u0456": "i", "\u043E": "o", "\u0440": "p", "\u0441": "c", "\u0443": "y", "\u0445": "x", "\u0410": "A", "\u0415": "E", "\u0406": "I", "\u041E": "O", "\u0420": "P", "\u0421": "C", "\u0425": "X"}
  - id: en_leetspeak
    type: map
    mapping: {"4": "a", "3": "e", "1": "i", "0": "o", "$": "s", "@": "a"}
  - id: en_strip_inserted_symbols
    type: strip_between
    chars: [".", "-", "*", "_"]
    between: "a-zA-Z"
  - id: en_collapse_repeats
    type: collapse_repeats
    max_run: 2
fixtures:
  - {input: "sc4m", expected: "scam"}
  - {input: "sc\u200Bam", expected: "scam"}
  - {input: "s\u0441\u0430m", expected: "scam"}
  - {input: "s.c*a-m", expected: "scam"}
  - {input: "freeee", expected: "free"}
  - {input: "ｓｃ４ｍ", expected: "scam"}
