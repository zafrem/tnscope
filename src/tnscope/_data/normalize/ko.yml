lang: ko
rules:
  # NFKC is deliberately not used: it rewrites compatibility jamo (choseong forms).
  - id: ko_fold_fullwidth_alnum
    type: map
    mapping: {"ａ": "a", "ｂ": "b", "ｃ": "c", "ｄ": "d", "ｅ": "e", "ｆ": "f", "ｇ": "g", "ｈ": "h", "ｉ": "i", "ｊ": "j", "ｋ": "k", "ｌ": "l", "ｍ": "m", "ｎ": "n", "ｏ": "o", "ｐ": "p", "ｑ": "q", "ｒ": "r", "ｓ": "s", "ｔ": "t", "ｕ": "u", "ｖ": "v", "ｗ": "w", "ｘ": "x", "ｙ": "y", "ｚ": "z", "Ａ": "A", "Ｂ": "B", "Ｃ": "C", "Ｄ": "D", "Ｅ": "E", "Ｆ": "F", "Ｇ": "G", "Ｈ": "H", "Ｉ": "I", "Ｊ": "J", "Ｋ": "K", "Ｌ": "L", "Ｍ": "M", "Ｎ": "N", "Ｏ": "O", "Ｐ": "P", "Ｑ": "Q", "Ｒ": "R", "Ｓ": "S", "Ｔ": "T", "Ｕ": "U", "Ｖ": "V", "Ｗ": "W", "Ｘ": "X", "Ｙ": "Y", "Ｚ": "Z", "０": "0", "１": "1", "２": "2", "３": "3", "４": "4", "５": "5", "６": "6", "７": "7", "８": "8", "９": "9"}
  - id: ko_strip_invisible
    type: strip
    chars: ["\u200B", "\u200C", "\u200D", "\uFEFF", "\u2060", "\u00AD"]
  - id: ko_strip_inserted_symbols
    type: strip_between
    chars: [".", "-", "*", "·", "_", "~", "/"]
    between: "가-힣"
  - id: ko_collapse_repeats
    type: collapse_repeats
    max_run: 2
fixtures:
  - {input: "원.금.보.장", expected: "원금보장"}
  - {input: "원*금-보·장", expected: "원금보장"}
  - {input: "원_금~보/장", expected: "원금보장"}
  - {input: "사\u200B기꾼", expected: "사기꾼"}
  - {input: "사기꾼꾼꾼", expected: "사기꾼꾼"}
  - {input: "ＯＴＰ번호", expected: "OTP번호"}
