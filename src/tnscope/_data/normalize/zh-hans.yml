lang: zh-hans
rules:
  - id: zh_hans_nfkc
    type: nfkc
  - id: zh_hans_strip_invisible
    type: strip
    chars: ["\u200B", "\u200C", "\u200D", "\uFEFF", "\u2060", "\u00AD"]
  - id: zh_hans_strip_inserted_symbols
    type: strip_between
    chars: [".", "-", "*", " ", "·", "_", "~", "/"]
    between: "一-\u9FFF"
  - id: zh_hans_collapse_repeats
    type: collapse_repeats
    max_run: 2
fixtures:
  - {input: "稳*赚*不*赔", expected: "稳赚不赔"}
  - {input: "稳 赚 不 赔", expected: "稳赚不赔"}
  - {input: "稳_赚~不/赔", expected: "稳赚不赔"}
  - {input: "骗\u200B子", expected: "骗子"}
  - {input: "加微信信信", expected: "加微信信"}
